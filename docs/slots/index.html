<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Шиномонтаж — свободное время</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Табло">
    <link rel="apple-touch-icon" href="icon-180.png">

    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { background-color: #121212; color: #e0e0e0; width: 100%; height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; padding: 4vh 4vw; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

        /* Часы: мигающее двоеточие = связь есть */
        .clock {
            text-align: center;
            font-size: 26vh;
            line-height: 1;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .clock .colon { display: inline-block; width: 0.55em; text-align: center; animation: blink 2s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        /* Нет связи: двоеточие статичное */
        body.offline .clock .colon { animation: none; opacity: 1; }
        body.offline .clock { color: #aaaaaa; }

        .slots-label {
            text-align: center;
            font-size: 4.5vh;
            font-weight: 700;
            color: #4CAF50;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin: 1.5vh 0 1vh 0;
        }

        .slots { flex: 1; display: flex; flex-direction: column; justify-content: space-around; overflow: hidden; }
        .slot {
            text-align: center;
            font-size: 8.5vh;
            line-height: 1.1;
            font-weight: 600;
            color: #e0e0e0;
            white-space: nowrap;
        }
        .slot em { font-style: normal; font-weight: 400; color: #aaaaaa; margin-right: 1.2vw; font-size: 0.75em; }

        .updated {
            text-align: center;
            font-size: 2.2vh;
            color: #666666;
            margin-top: 1.5vh;
        }

        @media (max-width: 700px) {
            /* Узкий экран (телефон через QR): колонки, поменьше шрифты */
            .clock { font-size: 20vw; }
            .slot { font-size: 7vw; }
        }
    </style>
</head>
<body>
    <div class="clock" id="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
    <div class="slots-label">свободное время</div>
    <div class="slots" id="slots">
        <div class="slot">…</div>
    </div>
    <div class="updated" id="updated"></div>

<script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxiqxOD5Fuj8FYLp3OEg5HKTbr1YS2gT7Dxp0BywWnoROYW85rkjD3clJc7dvfaVpJqiw/exec';
    var SLOTS_COUNT = 7;
    var AUTO_REFRESH_MS = 15000;
    var fetchInFlight = false;
    var lastUpdated = null;
    var lastDb = null;
    var everLoaded = false;

    var WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    var WDcap = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    var MG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function ymdOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function ymdLabel(ymd) {
        var p = ymd.split('-');
        var d = new Date(+p[0], +p[1] - 1, +p[2]);
        var today = ymdOf(new Date());
        var tomorrow = ymdOf(new Date(Date.now() + 86400000));
        if (ymd === today) return 'сегодня';
        if (ymd === tomorrow) return 'завтра';
        return WDcap[d.getDay()] + ', ' + d.getDate() + ' ' + MG[d.getMonth()];
    }

    // ---------- Часы ----------
    function tickClock() {
        var d = new Date();
        document.getElementById('hh').textContent = pad2(d.getHours());
        document.getElementById('mm').textContent = pad2(d.getMinutes());
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ---------- Wake Lock ----------
    var wakeLock = null;
    function requestWakeLock() {
        if ('wakeLock' in navigator && !wakeLock) {
            navigator.wakeLock.request('screen').then(function(wl) {
                wakeLock = wl;
                wakeLock.addEventListener('release', function() { wakeLock = null; });
            }).catch(function() {});
        }
    }
    requestWakeLock();

    // ---------- Данные ----------
    function refreshNow() {
        if (fetchInFlight) return;
        fetchInFlight = true;
        fetch(SCRIPT_URL + '?mode=fetch_json', { method: 'GET', cache: 'no-store' })
            .then(function(r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
            .then(function(db) {
                lastDb = db;
                everLoaded = true;
                lastUpdated = new Date();
                document.body.classList.remove('offline');
                renderSlots(db);
                document.getElementById('updated').textContent = 'обновлено ' + lastUpdated.toLocaleTimeString('ru-RU');
            })
            .catch(function() {
                document.body.classList.add('offline');
                if (!everLoaded) {
                    document.getElementById('slots').innerHTML = '<div class="slot">нет связи с сервером</div>';
                    document.getElementById('updated').textContent = '';
                }
            })
            .then(function() { fetchInFlight = false; });
    }

    // ---------- Слоты: формула шефа (выверена тестами) ----------
    function renderSlots(db) {
        var sched = db.schedule || {};
        var free = [];
        var now = new Date();
        var nowHour = now.getHours();
        var i, b;

        for (var dayOffset = 0; dayOffset <= 30 && free.length < SLOTS_COUNT; dayOffset++) {
            var ymd = ymdOf(new Date(now.getTime() + dayOffset * 86400000));
            var dayList = sched[ymd] || [];
            var busy = {};
            for (i = 0; i < dayList.length; i++) {
                b = dayList[i];
                if (b.status === 'booked' || b.status === 'done') {
                    for (var h = b.start; h < b.start + b.hours; h++) busy[h] = true;
                }
            }
            // Только ещё не начавшиеся слоты: вечером после 18:00 сегодня пусто
            var firstH = (dayOffset === 0) ? (nowHour >= 18 ? 18 : Math.min(17, nowHour + 1)) : 8;
            for (var hh = firstH; hh <= 17 && free.length < SLOTS_COUNT; hh++) {
                if (!busy[hh]) {
                    free.push({ label: ymdLabel(ymd), hh: hh });
                }
            }
        }

        var box = document.getElementById('slots');
        box.innerHTML = '';
        if (free.length === 0) {
            var none = document.createElement('div');
            none.className = 'slot';
            none.textContent = 'свободных слотов нет';
            box.appendChild(none);
            return;
        }
        for (i = 0; i < free.length; i++) {
            var row = document.createElement('div');
            row.className = 'slot';
            var em = document.createElement('em');
            em.textContent = free[i].label + ',';
            row.appendChild(em);
            row.appendChild(document.createTextNode(' ' + pad2(free[i].hh) + ':00'));
            box.appendChild(row);
        }
    }

    // ---------- Автообновление + возврат из сна ----------
    setInterval(function() {
        if (document.visibilityState === 'visible') { refreshNow(); }
    }, AUTO_REFRESH_MS);

    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
            refreshNow();
            requestWakeLock(); // пере-запрос после сна
        }
    });

    refreshNow();
</script>
</body>
</html>
